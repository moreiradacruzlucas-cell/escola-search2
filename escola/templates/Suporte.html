<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Suporte - Escola Search</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header>

    <div class="logo-area">

        <a href="{{ url_for('inicio') }}" class="logo">
            ESCOLA SEARCH
        </a>

        <form action="{{ url_for('editais') }}" method="GET" class="search-header">

            <input
                type="text"
                name="pesquisa"
                class="search-input"
                placeholder="Pesquisar escola, cidade ou edital...">

            <button type="submit" class="search-btn">
                🔍
            </button>

        </form>

    </div>

    <nav>
        <a href="{{ url_for('sobre') }}">ⓘ Sobre</a>
        <a href="{{ url_for('editais') }}">📄 Editais</a>
        <a href="{{ url_for('prazos') }}">📅 Prazos</a>
        <a href="{{ url_for('faq') }}">❔ FAQ</a>
        <a href="{{ url_for('suporte') }}">🎧 Suporte</a>
    </nav>

</header>

<main>

    <h1 class="titulo">🎧 Suporte</h1>

    <p class="texto">
        Precisa de ajuda? Entre em contato com o suporte do Escola Search.
    </p>

    <div class="sobre-container">

        <div class="card">

            <div class="icone">
                🎧
            </div>

            <h2>Contato</h2>

            <p>
                Entre em contato para tirar dúvidas sobre matrículas,
                editais e prazos.
            </p>

        </div>

        <div class="card">

            <div class="icone">
                💬
            </div>

            <h2>Atendimento</h2>

            <p>
                Envie sua dúvida e nossa equipe poderá ajudar.
            </p>

        </div>

    </div>

</main>

</body>
</html>

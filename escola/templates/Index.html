<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Escola Search</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header>

    <div class="logo-area">

        <a href="{{ url_for('inicio') }}" class="logo">
            ESCOLA SEARCH
        </a>

        <form action="{{ url_for('editais') }}" method="GET" class="search-header">

            <input
                type="text"
                name="pesquisa"
                class="search-input"
                placeholder="Pesquisar escola, cidade ou edital...">

            <button type="submit" class="search-btn">
                🔍
            </button>

        </form>

    </div>

    <nav>
        <a href="{{ url_for('sobre') }}">ⓘ Sobre</a>
        <a href="{{ url_for('editais') }}">📄 Editais</a>
        <a href="{{ url_for('prazos') }}">📅 Prazos</a>
        <a href="{{ url_for('faq') }}">❔ FAQ</a>
        <a href="{{ url_for('suporte') }}">🎧 Suporte</a>
    </nav>

</header>

<main class="inicio">

    <h1 class="bem-vindo">
        Bem-vindo, {{ nome }}!
    </h1>

    <h1 class="titulo-inicio">
        Ao Escola Search
    </h1>

    <p class="texto-inicio">
        Encontre informações sobre matrícula escolar, documentos necessários,
        editais, prazos e dúvidas frequentes.
    </p>

</main>

</body>

</html>
